<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 362">
  <defs>
    <clipPath id="circleClipWhite">
      <circle cx="171" cy="183" r="175"/>
    </clipPath>
  </defs>

  <!-- White circle base -->
  <circle cx="171" cy="183" r="175" fill="#ffffff"/>

  <!-- Dark navy house silhouette (roof + wall), clipped to the circle -->
  <g clip-path="url(#circleClipWhite)">
    <polygon points="-60,110 90,58 178,131 178,370 -60,370" fill="#111827"/>
  </g>

  <!-- Windows in white -->
  <rect x="41" y="173" width="26" height="40" fill="#ffffff"/>
  <rect x="86" y="173" width="28" height="39" fill="#ffffff"/>
  <rect x="131" y="173" width="27" height="40" fill="#ffffff"/>
  <rect x="88" y="236" width="28" height="39" fill="#ffffff"/>
  <rect x="134" y="235" width="27" height="41" fill="#ffffff"/>
  <rect x="136" y="296" width="27" height="40" fill="#ffffff"/>

  <!-- ADN wordmark in dark navy -->
  <text x="264" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#111827">A</text>
  <text x="264" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#111827">D</text>
  <text x="264" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#111827">N</text>
</svg>
