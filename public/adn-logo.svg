<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 362">
  <defs>
    <clipPath id="circleClip">
      <circle cx="171" cy="183" r="175"/>
    </clipPath>
  </defs>

  <!-- Blue circle base -->
  <circle cx="171" cy="183" r="175" fill="#0A4A78"/>

  <!-- White house silhouette (roof + wall), clipped to the circle -->
  <g clip-path="url(#circleClip)">
    <polygon points="-60,110 90,58 178,131 178,370 -60,370" fill="#ffffff"/>
  </g>

  <!-- Windows -->
  <rect x="41" y="173" width="26" height="40" fill="#0A4A78"/>
  <rect x="86" y="173" width="28" height="39" fill="#0A4A78"/>
  <rect x="131" y="173" width="27" height="40" fill="#0A4A78"/>
  <rect x="88" y="236" width="28" height="39" fill="#0A4A78"/>
  <rect x="134" y="235" width="27" height="41" fill="#0A4A78"/>
  <rect x="136" y="296" width="27" height="40" fill="#0A4A78"/>

  <!-- ADN wordmark -->
  <text x="264" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#ffffff">A</text>
  <text x="264" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#ffffff">D</text>
  <text x="264" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="92" fill="#ffffff">N</text>
</svg>
